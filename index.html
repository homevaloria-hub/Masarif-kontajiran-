<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كونتاجيران - إدارة المصاريف</title>
    <style>
        :root {
            --bg-color: #f7f5f0;
            --card-bg: #ffffff;
            --accent-color: #1a1a1a;
            --text-muted: #666666;
            --border-radius: 16px;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #333;
            direction: rtl;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        h2 {
            margin-top: 0;
            font-size: 1.2rem;
            color: var(--accent-color);
        }

        /* تحسينات الواجهة والمحاذاة الجديدة */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 14px;
        }

        label {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        input[type="text"],
        input[type="number"],
        input[type="date"],
        input[type="time"],
        select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            font-size: 0.95rem;
            box-sizing: border-box;
            background-color: #fafafa;
            /* ضبط محاذاة الأسهم والحقول */
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg fill='black' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");
            background-repeat: no-repeat;
            background-position: left 10px center;
            background-size: 18px;
        }

        input[type="date"]::-webkit-calendar-picker-indicator {
            cursor: pointer;
            opacity: 0.6;
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            margin-top: 8px;
        }

        .backup-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        canvas {
            max-width: 100%;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- نموذج المواعيد والقادمة مع محاذاة محسنة -->
    <div class="card">
        <h2>إضافة موعد جديد</h2>
        <div class="input-group">
            <label>الموعد</label>
            <input type="text" placeholder="مثلا: اجتماع، طيارة، طبيب...">
        </div>
        
        <div class="input-group">
            <label>التاريخ والوقت (محدد ومحاذى)</label>
            <input type="date" id="appointmentDate">
            <input type="time" id="appointmentTime" style="margin-top: 6px;">
        </div>

        <button class="btn" onclick="saveAppointment()">حفظ الموعد</button>
    </div>

    <!-- نظام التقارير البيانية -->
    <div class="card">
        <h2>ملخص المصاريف البياني</h2>
        <canvas id="expenseChart" width="400" height="200"></canvas>
    </div>

    <!-- نظام النسخ الاحتياطي وتصدير البيانات -->
    <div class="card">
        <h2>إدارة البيانات والنسخ الاحتياطي</h2>
        <div class="backup-controls">
            <button class="btn" onclick="exportData()">تصدير JSON</button>
            <button class="btn btn-outline" onclick="document.getElementById('importFile').click()">استرجاع</button>
        </div>
        <input type="file" id="importFile" style="display:none" onchange="importData(event)">
    </div>

</div>

<script>
    // 1. إدارة البيانات والتخزين المحلي
    let appData = JSON.parse(localStorage.getItem('contajiran_data')) || {
        appointments: [],
        expenses: [
            { category: 'الأكل', amount: 1200 },
            { category: 'السيارة', amount: 800 },
            { category: 'السكن', amount: 2500 }
        ]
    };

    function saveData() {
        localStorage.setItem('contajiran_data', JSON.stringify(appData));
    }

    // 2. حفظ المواعيد
    function saveAppointment() {
        const date = document.getElementById('appointmentDate').value;
        const time = document.getElementById('appointmentTime').value;
        if(date) {
            appData.appointments.push({ date, time });
            saveData();
            alert('تم حفظ الموعد بنجاح');
        } else {
            alert('يرجى تحديد التاريخ');
        }
    }

    // 3. تصدير واسترجاع النسخة الاحتياطية (JSON)
    function exportData() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `contajiran_backup_${new Date().toISOString().slice(0,10)}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    }

    function importData(event) {
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                appData = JSON.parse(e.target.result);
                saveData();
                alert('تم استرجاع البيانات بنجاح!');
                location.reload();
            } catch(err) {
                alert('الملف غير صالح');
            }
        };
        reader.readAsText(event.target.files[0]);
    }

    // 4. رسم بياني بسيط باستخدام Canvas
    function drawChart() {
        const canvas = document.getElementById('expenseChart');
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const colors = ['#1a1a1a', '#666666', '#a6a6a6'];
        let total = appData.expenses.reduce((acc, curr) => acc + curr.amount, 0);
        let startAngle = 0;

        appData.expenses.forEach((item, index) => {
            let sliceAngle = (2 * Math.PI * item.amount) / total;

            ctx.fillStyle = colors[index % colors.length];
            ctx.beginPath();
            ctx.moveTo(100, 100);
            ctx.arc(100, 100, 80, startAngle, startAngle + sliceAngle);
            ctx.closePath();
            ctx.fill();

            // المفتاح (Legend)
            ctx.fillRect(210, 30 + (index * 30), 15, 15);
            ctx.fillStyle = '#333';
            ctx.font = '14px sans-serif';
            ctx.fillText(`${item.category}: ${item.amount} درهم`, 235, 43 + (index * 30));

            startAngle += sliceAngle;
        });
    }

    window.onload = drawChart;
</script>

</body>
</html>
